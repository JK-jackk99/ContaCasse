<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casse aperte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --testo: #fff7d6;
    --testo2: #ffc93c;
    --bordo-num: #3a1d00;
    --etichetta: #ffd866;
    --fondo: rgba(14, 10, 24, .62);
    --cornice: rgba(255, 201, 60, .75);
    --bagliore: rgba(255, 196, 40, .85);
    --scala: 1;
  }
  body.neon {
    --testo: #eafffe; --testo2: #5ef2ff; --bordo-num: #06203a; --etichetta: #ff5ee8;
    --fondo: rgba(8, 6, 26, .62); --cornice: rgba(94, 242, 255, .8); --bagliore: rgba(255, 94, 232, .85);
  }
  body.bianco {
    --testo: #ffffff; --testo2: #ffffff; --bordo-num: #000000; --etichetta: #ffffff;
    --fondo: rgba(0, 0, 0, .45); --cornice: rgba(255, 255, 255, .55); --bagliore: rgba(255, 255, 255, .8);
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body.verde { background: #00ff00; }
  body {
    font-family: "Lilita One", "Arial Black", Impact, sans-serif;
    padding: 18px;
  }
  .scatola {
    display: inline-flex; align-items: center; gap: 14px;
    padding: 10px 26px 10px 12px;
    border-radius: 999px;
    background: var(--fondo);
    border: 3px solid var(--cornice);
    box-shadow: 0 6px 22px rgba(0,0,0,.35);
    transform: scale(var(--scala)); transform-origin: top left;
  }
  body.senza-fondo .scatola { background: none; border-color: transparent; box-shadow: none; }
  .icona { width: 78px; height: 78px; flex: none; position: relative; overflow: visible; }
  .icona svg { width: 100%; height: 100%; overflow: visible; }
  body.senza-icona .icona { display: none; }
  .coperchio { transform-origin: 32px 30px; transform-box: view-box; }
  .luce { opacity: 0; }
  .testi { display: flex; flex-direction: column; line-height: 1; }
  .etichetta {
    font-size: 19px; letter-spacing: .08em; color: var(--etichetta);
    text-shadow: 0 2px 0 rgba(0,0,0,.6);
    margin-bottom: 2px;
  }
  .riga { position: relative; display: flex; align-items: baseline; }
  .numero {
    font-size: 64px;
    background: linear-gradient(180deg, var(--testo) 30%, var(--testo2) 85%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 3px var(--bordo-num);
    paint-order: stroke fill;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,.45));
    display: inline-block; transform-origin: 30% 70%;
    font-variant-numeric: tabular-nums;
  }
  .piu {
    position: absolute; left: 100%; top: 0; margin-left: 8px;
    font-size: 34px; color: var(--testo2);
    -webkit-text-stroke: 2px var(--bordo-num); paint-order: stroke fill;
    opacity: 0; pointer-events: none; white-space: nowrap;
  }
  .scintilla {
    position: absolute; width: 10px; height: 10px; left: 50%; top: 45%;
    background: var(--testo2); border-radius: 2px; transform: rotate(45deg);
    box-shadow: 0 0 10px var(--bagliore); opacity: 0; pointer-events: none;
  }

  .apri .coperchio { animation: coperchio .9s cubic-bezier(.3,1.6,.5,1); }
  .apri .luce { animation: luce .9s ease-out; }
  .apri .numero { animation: pop .65s cubic-bezier(.2,1.8,.4,1); }
  .apri .piu { animation: sale 1.1s ease-out; }
  .apri .scatola { animation: bagliore 1s ease-out; }
  .giu .numero { animation: giu .4s ease-out; }

  @keyframes coperchio {
    0% { transform: rotate(0); } 25% { transform: rotate(-28deg) translateY(-3px); }
    60% { transform: rotate(-18deg); } 100% { transform: rotate(0); }
  }
  @keyframes luce { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop {
    0% { transform: scale(1); } 30% { transform: scale(1.45) rotate(-4deg); filter: brightness(1.6) drop-shadow(0 4px 0 rgba(0,0,0,.45)); }
    100% { transform: scale(1); }
  }
  @keyframes sale { 0% { opacity: 0; transform: translateY(14px) scale(.7); } 20% { opacity: 1; transform: translateY(0) scale(1.1); } 100% { opacity: 0; transform: translateY(-34px) scale(1); } }
  @keyframes bagliore { 0% { box-shadow: 0 0 0 0 var(--bagliore), 0 6px 22px rgba(0,0,0,.35); } 25% { box-shadow: 0 0 34px 6px var(--bagliore), 0 6px 22px rgba(0,0,0,.35); } 100% { box-shadow: 0 0 0 0 transparent, 0 6px 22px rgba(0,0,0,.35); } }
  @keyframes giu { 0% { opacity: .2; transform: translateY(-8px); } 100% { opacity: 1; transform: none; } }
  @keyframes scintilla {
    0% { opacity: 1; transform: translate(0,0) rotate(45deg) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(225deg) scale(.3); }
  }
  @media (prefers-reduced-motion: reduce) {
    .apri .coperchio, .apri .luce, .apri .numero, .apri .piu, .apri .scatola { animation-duration: .01s; }
  }
</style>
</head>
<body>
  <div class="scatola">
    <div class="icona" id="icona">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="legno" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#a65e2a"/><stop offset="1" stop-color="#5e2f12"/>
          </linearGradient>
          <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff1a8"/><stop offset=".5" stop-color="#ffc93c"/><stop offset="1" stop-color="#c47f00"/>
          </linearGradient>
          <radialGradient id="raggi" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#fff6c2"/><stop offset=".5" stop-color="#ffcf3a" stop-opacity=".7"/><stop offset="1" stop-color="#ffcf3a" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <ellipse class="luce" cx="32" cy="28" rx="30" ry="22" fill="url(#raggi)"/>
        <rect x="8" y="30" width="48" height="26" rx="4" fill="url(#legno)" stroke="#2a1406" stroke-width="2.5"/>
        <rect x="13" y="30" width="5" height="26" fill="url(#oro)" stroke="#5a3500" stroke-width="1"/>
        <rect x="46" y="30" width="5" height="26" fill="url(#oro)" stroke="#5a3500" stroke-width="1"/>
        <rect x="8" y="49" width="48" height="4" fill="#3b1c08" opacity=".45"/>
        <g class="coperchio">
          <path d="M8 31 V23 Q8 11 32 11 Q56 11 56 23 V31 Z" fill="url(#legno)" stroke="#2a1406" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M13 31 V17.5 Q15 14 18 13.4 V31 Z" fill="url(#oro)" stroke="#5a3500" stroke-width="1"/>
          <path d="M46 13.4 Q49 14 51 17.5 V31 H46 Z" fill="url(#oro)" stroke="#5a3500" stroke-width="1"/>
          <path d="M10 18 Q32 9 54 18" fill="none" stroke="#ffd98a" stroke-width="1.5" opacity=".35"/>
        </g>
        <rect x="26.5" y="26" width="11" height="13" rx="2.5" fill="url(#oro)" stroke="#5a3500" stroke-width="1.5"/>
        <circle cx="32" cy="31.5" r="1.8" fill="#4a2a00"/><rect x="31.2" y="32" width="1.6" height="4" fill="#4a2a00"/>
      </svg>
    </div>
    <div class="testi">
      <div class="etichetta" id="etichetta">CASSE APERTE</div>
      <div class="riga">
        <span class="numero" id="numero">0</span>
        <span class="piu" id="piu">+1</span>
      </div>
    </div>
  </div>

<script>
  const p = new URLSearchParams(location.search);
  const b = document.body;
  const tema = (p.get("tema") || "oro").toLowerCase();
  if (tema !== "oro") b.classList.add(tema);
  if (p.get("sfondo") === "0") b.classList.add("senza-fondo");
  if (p.get("icona") === "0") b.classList.add("senza-icona");
  if (p.get("verde") === "1") b.classList.add("verde");
  if (p.has("scala")) document.documentElement.style.setProperty("--scala", Math.max(.3, Math.min(4, parseFloat(p.get("scala")) || 1)));
  const et = document.getElementById("etichetta");
  if (p.has("etichetta")) { et.textContent = p.get("etichetta"); if (!p.get("etichetta")) et.style.display = "none"; }

  const numero = document.getElementById("numero");
  const piu = document.getElementById("piu");
  const icona = document.getElementById("icona");
  let attuale = null;

  function riavvia(classe) {
    b.classList.remove("apri", "giu");
    void b.offsetWidth;
    b.classList.add(classe);
  }
  function scintille() {
    for (let i = 0; i < 10; i++) {
      const s = document.createElement("span");
      s.className = "scintilla";
      const a = (Math.PI * 2 * i) / 10 + Math.random() * .5;
      const d = 34 + Math.random() * 26;
      s.style.setProperty("--dx", Math.cos(a) * d + "px");
      s.style.setProperty("--dy", Math.sin(a) * d - 10 + "px");
      s.style.animation = `scintilla ${0.6 + Math.random() * 0.4}s ease-out forwards`;
      icona.appendChild(s);
      setTimeout(() => s.remove(), 1200);
    }
  }
  function mostra(v) {
    if (attuale !== null && v > attuale) {
      piu.textContent = "+" + (v - attuale);
      riavvia("apri");
      if (!b.classList.contains("senza-icona")) scintille();
    } else if (attuale !== null && v < attuale) {
      riavvia("giu");
    }
    attuale = v;
    numero.textContent = v;
  }

  function collega() {
    const es = new EventSource("/eventi");
    es.addEventListener("contatore", e => mostra(JSON.parse(e.data).valore));
  }
  fetch("/api/contatore").then(r => r.json()).then(d => mostra(d.valore)).catch(() => {}).finally(collega);
</script>
</body>
</html>
